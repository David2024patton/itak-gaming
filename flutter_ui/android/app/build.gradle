plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "net.itak.itak_gaming"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "net.itak.itak_gaming"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        // Display versions drop a trailing .0 patch: David's scheme
        // shows build 62 as 1.61 and the 64-bit launch as 2.0, while
        // pubspec keeps the three-part form pub requires (1.61.0+62).
        versionName = flutter.versionName.replaceAll(/\.0$/, "")

        // 32-bit build for Chromecast HD. The Go backend AAR and bundled
        // cores are armeabi-v7a only.
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Go emulation backend (gomobile AAR, armeabi-v7a)
    implementation files('libs/itak_backend.aar')
}
